<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Primjena GIS tehnologija u analizi prostornih podataka i razvoju interaktivne web-karte Općine Grude</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/Grudeprijedlogizmjene_1.js"></script>
        <script src="data/Noveadrese_2.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:18, minZoom:10
        }).fitBounds([[43.34495100525425,17.38536667942925],[43.38315411897465,17.4543700930385]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_SatelitskasnimkaGoogle_0');
        map.getPane('pane_SatelitskasnimkaGoogle_0').style.zIndex = 400;
        var layer_SatelitskasnimkaGoogle_0 = L.tileLayer('https://www.google.cn/maps/vt?lyrs=s@189&gl=cn&x={x}&y={y}&z={z}', {
            pane: 'pane_SatelitskasnimkaGoogle_0',
            opacity: 0.7,
            attribution: '',
            minZoom: 10,
            maxZoom: 18,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_SatelitskasnimkaGoogle_0;
        map.addLayer(layer_SatelitskasnimkaGoogle_0);
        function pop_Grudeprijedlogizmjene_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><strong>Naselje</strong><br />' + (feature.properties['Naselje'] !== null ? autolinker.link(String(feature.properties['Naselje']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Ulica</strong><br />' + (feature.properties['Ulica'] !== null ? autolinker.link(String(feature.properties['Ulica']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Grudeprijedlogizmjene_1_0() {
            return {
                pane: 'pane_Grudeprijedlogizmjene_1',
                opacity: 1,
                color: 'rgba(127,127,127,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 0.75,
                fillColor: 'rgba(255,249,183,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Grudeprijedlogizmjene_1');
        map.getPane('pane_Grudeprijedlogizmjene_1').style.zIndex = 401;
        map.getPane('pane_Grudeprijedlogizmjene_1').style['mix-blend-mode'] = 'normal';
        var layer_Grudeprijedlogizmjene_1 = new L.geoJson(json_Grudeprijedlogizmjene_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Grudeprijedlogizmjene_1',
            layerName: 'layer_Grudeprijedlogizmjene_1',
            pane: 'pane_Grudeprijedlogizmjene_1',
            onEachFeature: pop_Grudeprijedlogizmjene_1,
            style: style_Grudeprijedlogizmjene_1_0,
        });
        bounds_group.addLayer(layer_Grudeprijedlogizmjene_1);
        map.addLayer(layer_Grudeprijedlogizmjene_1);
        function pop_Noveadrese_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['ID'] !== null ? autolinker.link(String(feature.properties['ID']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Napomene</strong><br />' + (feature.properties['Napomene'] !== null ? autolinker.link(String(feature.properties['Napomene']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Adresa</strong><br />' + (feature.properties['Adresa'] !== null ? autolinker.link(String(feature.properties['Adresa']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Noveadrese_2_0() {
            return {
                pane: 'pane_Noveadrese_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(227,26,28,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Noveadrese_2');
        map.getPane('pane_Noveadrese_2').style.zIndex = 402;
        map.getPane('pane_Noveadrese_2').style['mix-blend-mode'] = 'normal';
        var layer_Noveadrese_2 = new L.geoJson(json_Noveadrese_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Noveadrese_2',
            layerName: 'layer_Noveadrese_2',
            pane: 'pane_Noveadrese_2',
            onEachFeature: pop_Noveadrese_2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Noveadrese_2_0(feature));
            },
        });
        bounds_group.addLayer(layer_Noveadrese_2);
        map.addLayer(layer_Noveadrese_2);
        var overlaysTree = [
            {label: '<img src="legend/Noveadrese_2.png" /> Nove adrese', layer: layer_Noveadrese_2},
            {label: '<img src="legend/Grudeprijedlogizmjene_1.png" /> Grude-prijedlog izmjene', layer: layer_Grudeprijedlogizmjene_1},
            {label: "Satelitska snimka - Google", layer: layer_SatelitskasnimkaGoogle_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_Noveadrese_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Adresa'] !== null?String('<div style="color: #e31a1c; font-size: 8pt; font-family: \'PT Sans\', sans-serif;">' + layer.feature.properties['Adresa']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Noveadrese_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_Noveadrese_2]);
        map.on("zoomend", function(){
            resetLabels([layer_Noveadrese_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Noveadrese_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Noveadrese_2]);
        });
        </script>        
    </body>
</html>
